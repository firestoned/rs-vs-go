apiVersion: v1
kind: ServiceAccount
metadata:
  name: cmwatch
  namespace: ${BENCH_NS}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cmwatch
  namespace: ${BENCH_NS}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cmwatch
  namespace: ${BENCH_NS}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cmwatch
subjects:
  - kind: ServiceAccount
    name: cmwatch
    namespace: ${BENCH_NS}
